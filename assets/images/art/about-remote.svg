<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
<title id="t">Working remotely with service businesses</title><desc id="d">A project conversation panel connected to a map of the United States with service-area markers.</desc>
<defs><filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1f3a" flood-opacity="0.10"/>
</filter></defs>
<rect width="1000" height="780" rx="20" fill="#f7f5f1"/>
<g filter="url(#soft)" transform="translate(70 70)">
  <rect width="470" height="330" rx="20" fill="#ffffff" stroke="#dde3ec"/>
  <text x="28" y="52" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0b1f3a">Project conversation</text>
  <rect x="28" y="76" width="300" height="62" rx="14" fill="#f7f5f1"/>
  <text x="46" y="104" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#16345c">We get five calls a week but almost</text>
  <text x="46" y="124" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#16345c">no quote requests from the website.</text>
  <rect x="142" y="154" width="300" height="82" rx="14" fill="#0b1f3a"/>
  <text x="160" y="182" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#ffffff">The quote form is three clicks deep</text>
  <text x="160" y="202" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#ffffff">and there is no service page for the</text>
  <text x="160" y="222" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#ffffff">work you actually want. Start there.</text>
  <rect x="28" y="252" width="230" height="52" rx="14" fill="#f7f5f1"/>
  <text x="46" y="283" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#16345c">When can we start?</text>
</g>
<g filter="url(#soft)" transform="translate(300 440)">
  <rect width="620" height="280" rx="20" fill="#ffffff" stroke="#dde3ec"/>
  <text x="32" y="52" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0b1f3a">Remote, across the United States</text>
  <path d="M60 96 C 110 78 180 74 250 88 C 330 104 400 92 470 86 C 520 82 550 96 560 118 C 566 154 540 186 500 200 C 430 224 340 226 260 214 C 180 202 110 186 76 156 C 56 138 50 112 60 96 Z" fill="#eaf1f8" stroke="#dbe4ef" stroke-width="2"/>
  <g transform="translate(150 130)"><path d="M0 20 C -12 6 -14 2 -14 -4 a14 14 0 0 1 28 0 c0 6 -2 10 -14 24 Z" fill="#b08948"/><circle cy="-4" r="5" fill="#ffffff"/></g><g transform="translate(250 160)"><path d="M0 20 C -12 6 -14 2 -14 -4 a14 14 0 0 1 28 0 c0 6 -2 10 -14 24 Z" fill="#0b1f3a"/><circle cy="-4" r="5" fill="#ffffff"/></g><g transform="translate(340 120)"><path d="M0 20 C -12 6 -14 2 -14 -4 a14 14 0 0 1 28 0 c0 6 -2 10 -14 24 Z" fill="#0b1f3a"/><circle cy="-4" r="5" fill="#ffffff"/></g><g transform="translate(430 168)"><path d="M0 20 C -12 6 -14 2 -14 -4 a14 14 0 0 1 28 0 c0 6 -2 10 -14 24 Z" fill="#b08948"/><circle cy="-4" r="5" fill="#ffffff"/></g><g transform="translate(500 132)"><path d="M0 20 C -12 6 -14 2 -14 -4 a14 14 0 0 1 28 0 c0 6 -2 10 -14 24 Z" fill="#0b1f3a"/><circle cy="-4" r="5" fill="#ffffff"/></g><g transform="translate(200 190)"><path d="M0 20 C -12 6 -14 2 -14 -4 a14 14 0 0 1 28 0 c0 6 -2 10 -14 24 Z" fill="#0b1f3a"/><circle cy="-4" r="5" fill="#ffffff"/></g><g transform="translate(390 196)"><path d="M0 20 C -12 6 -14 2 -14 -4 a14 14 0 0 1 28 0 c0 6 -2 10 -14 24 Z" fill="#b08948"/><circle cy="-4" r="5" fill="#ffffff"/></g>
  <text x="32" y="254" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#5b6b80">Clients served remotely &#183; no in-person visits required</text>
</g>
</svg>
